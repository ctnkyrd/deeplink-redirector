<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
        }
    </style>
    <script type="text/javascript">
        // Store the time when we started
        var startTime = new Date().getTime();
        
        function handleRedirect() {
            // Create a hidden link element
            var link = document.createElement('a');
            link.id = 'appLink';
            link.href = 'https://app.apcoaflow.com/?space=123';
            link.style.display = 'none';
            document.body.appendChild(link);
            
            // Set up the fallback timer first before doing anything else
            var fallbackTimer = setTimeout(function() {
                window.location.replace("https://spo.dev.evmng.valuespaces.io/SPO_TEST_DEU_9001");
            }, 1500);
            
            // Test if we left the page
            window.addEventListener('blur', function() {
                clearTimeout(fallbackTimer);
            });
            
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    clearTimeout(fallbackTimer);
                }
            });
            
            // Add a pagehide listener as well
            window.addEventListener('pagehide', function() {
                clearTimeout(fallbackTimer);
            });
            
            // Simulate a click on the link
            setTimeout(function() {
                try {
                    var event = new MouseEvent('click', {
                        view: window,
                        bubbles: true,
                        cancelable: true
                    });
                    link.dispatchEvent(event);
                } catch(e) {
                    // Fallback for older browsers
                    link.click();
                }
            }, 100);
            
            // Add a backup approach - sometimes the first method doesn't trigger the listeners
            setTimeout(function() {
                var currentTime = new Date().getTime();
                // If we're still here after more than 1200ms, assume app didn't open
                if (currentTime - startTime > 1200) {
                    window.location.replace("https://spo.dev.evmng.valuespaces.io/SPO_TEST_DEU_9001");
                }
            }, 1200);
        }
        
        // Start the process after a brief delay
        window.onload = function() {
            setTimeout(handleRedirect, 50);
        };
    </script>
</head>
<body>
</body>
</html>
