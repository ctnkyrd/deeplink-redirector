<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4267B2;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Choose your destination</h2>
    <p>Tap the button below to continue</p>
    
    <a href="fb://profile/4" class="button" id="openButton">Continue</a>
    
    <script type="text/javascript">
        // Auto-redirect to SPO page after a delay
        setTimeout(function() {
            window.location = "https://spo.dev.evmng.valuespaces.io/SPO_TEST_DEU_9001";
        }, 3000);
        
        // If user taps the button, prevent the auto-redirect
        document.getElementById('openButton').addEventListener('click', function() {
            // Clear any possible redirects
            setTimeout(function() {
                // If we're still on the page after attempting to open Facebook
                if (document.visibilityState !== 'hidden') {
                    window.location = "https://spo.dev.evmng.valuespaces.io/SPO_TEST_DEU_9001";
                }
            }, 1000);
        });
    </script>
</body>
</html>
